[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beready"
version = "0.1.0"
description = "Deterministic hiking preparation policy and commercial API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.135,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.11,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "streamlit>=1.63,<2"]
legacy = ["streamlit>=1.63,<2"]

[tool.setuptools.packages.find]
include = ["beready*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
